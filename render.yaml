services:
  - type: web
    name: velvet-ace-live
    runtime: node
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: node dist/server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_BASE_URL
        value: https://poker.torly.co
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
